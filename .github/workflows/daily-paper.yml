name: Daily Bioinformatics Paper Writer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write

jobs:
  daily-research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m daily_run
      - name: Commit daily archive
        run: |
          git config user.name 'daily-paper-writer[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/daily
          git diff --cached --quiet || git commit -m "Daily research archive $(date -u +%F)"
          git push
